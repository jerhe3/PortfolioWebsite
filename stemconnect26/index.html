<style>
/* Layout: transit system map as the hero (fills the viewport, pans on phones), station board overlays the map, line timetables below. */
:root {
  --bg: #ffffff;
  --ink: #111a26;
  --muted: #5d6877;
  --rule: #e3e7ec;
  --ghost: #eef1f5;
  --station: #ffffff;
  --sheet: #ffffff;
  --sweep: rgba(255, 255, 255, .85);
  --focus: #1f6feb;
  --l-chairs: #b8860b;
  --l-logistics: #00935f;
  --l-marketing: #d0287a;
  --l-programming: #0067c5;
  --l-sasehack: #ef7d00;
  --f-sign: "Overpass", "Helvetica Neue", Arial, system-ui, sans-serif;
  --f-mono: "Overpass Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b111a; --ink: #edf1f6; --muted: #98a3b3; --rule: #1f2a3a; --ghost: #121b28;
    --station: #0b111a; --sheet: #131c29; --sweep: rgba(255, 255, 255, .7); --focus: #6ea8ff;
    --l-chairs: #e3b23c; --l-logistics: #1fc285; --l-marketing: #ff5ca8; --l-programming: #4d9dff; --l-sasehack: #ff9a2e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b111a; --ink: #edf1f6; --muted: #98a3b3; --rule: #1f2a3a; --ghost: #121b28;
  --station: #0b111a; --sheet: #131c29; --sweep: rgba(255, 255, 255, .7); --focus: #6ea8ff;
  --l-chairs: #e3b23c; --l-logistics: #1fc285; --l-marketing: #ff5ca8; --l-programming: #4d9dff; --l-sasehack: #ff9a2e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-sign); font-size: 15px; line-height: 1.45; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2.5px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }

.titlebar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; padding-block: 12px 10px; border-bottom: 3px solid var(--ink); }
.titlebar h1 { margin: 0; font-weight: 900; font-size: clamp(22px, 2.6vw, 30px); line-height: 1; letter-spacing: -0.01em; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; }
.lbtn { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px 5px 5px; border: 2px solid var(--rule); border-radius: 999px; background: var(--bg); cursor: pointer; font-weight: 700; font-size: 14px; transition: border-color .15s ease, transform .15s ease; }
.lbtn:hover { transform: translateY(-1px); }
.lbtn[aria-pressed="true"] { border-color: var(--lc); }
.lbtn .n { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.roundel { width: 24px; height: 24px; border-radius: 50%; background: var(--lc); color: #fff; display: inline-grid; place-items: center; font-weight: 900; font-size: 13px; line-height: 1; flex: none; }
.roundel.express { box-shadow: inset 0 0 0 3px var(--lc), inset 0 0 0 5px var(--bg); }

.stage { position: relative; }
.frame { position: relative; height: clamp(440px, calc(100svh - 70px), 940px); overflow: hidden; }
.frame svg { display: block; width: 100%; height: 100%; }
.ghost { fill: var(--ghost); }
.line { fill: none; stroke-linecap: round; stroke-linejoin: round; transition: opacity .25s ease; }
.line.core { stroke: var(--bg); stroke-width: 1.8; }
.line.sweep { stroke: var(--sweep); stroke-width: 3; stroke-dasharray: 70 2000; stroke-dashoffset: 70; animation: sweep 1.6s cubic-bezier(.45, 0, .2, 1) forwards; animation-delay: calc(var(--i) * 180ms + 150ms); }
@keyframes sweep { to { stroke-dashoffset: -1000; } }
.train { fill: var(--bg); stroke-width: 1.8; pointer-events: none; }
.dim { opacity: .14; }
#lines g, .stn, .lbl, #trains g { transition: opacity .25s ease; }
.stn { cursor: pointer; }
.stn:focus { outline: none; }
.pop { transform-box: fill-box; transform-origin: center; animation: pop .5s cubic-bezier(.3, 1.6, .5, 1) backwards; animation-delay: calc(var(--d) * 1ms); }
@keyframes pop { from { transform: scale(.55); } }
.stn .ring { fill: var(--station); stroke-width: 2.6; }
.stn .halo { fill: none; stroke: var(--focus); stroke-width: 2.4; opacity: 0; transform-box: fill-box; transform-origin: center; transition: opacity .15s ease, transform .2s ease; transform: scale(.85); }
.stn:hover .halo, .stn:focus-visible .halo, .stn.on .halo { opacity: 1; transform: scale(1); }
.stn.on .halo { animation: ping 1.8s ease-out infinite; }
@keyframes ping { 0% { transform: scale(1); opacity: 1; } 70%, 100% { transform: scale(1.5); opacity: 0; } }
.stn .cnt { font-family: var(--f-sign); font-weight: 800; fill: var(--ink); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.lbl { font-family: var(--f-sign); font-weight: 700; font-size: 13px; fill: var(--ink); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }

.board { position: absolute; top: 14px; right: max(16px, env(safe-area-inset-right, 0px)); width: min(380px, calc(100% - 32px)); max-height: calc(100% - 28px); overflow: auto; overscroll-behavior: contain; background: var(--sheet); border: 2px solid var(--ink); border-radius: 6px; box-shadow: 0 12px 32px rgba(10, 20, 35, .18); animation: slide-in .28s cubic-bezier(.2, .8, .2, 1); }
@keyframes slide-in { from { transform: translateX(24px); opacity: 0; } }
.board header { position: sticky; top: 0; z-index: 1; background: var(--ink); color: var(--bg); padding: 12px 44px 12px 14px; }
.board h2 { margin: 0; font-size: 22px; font-weight: 900; line-height: 1.1; }
.board .coord { font-family: var(--f-mono); font-size: 11.5px; opacity: .75; margin-top: 3px; }
.board .serves { display: flex; gap: 5px; margin-top: 8px; }
.board .x { position: absolute; top: 10px; right: 10px; width: 28px; height: 28px; border-radius: 50%; border: 0; background: transparent; color: var(--bg); font-size: 20px; line-height: 1; cursor: pointer; }
.board ul { list-style: none; margin: 0; padding: 4px 14px 10px; }
.board .rider { animation: rise .35s ease-out backwards; animation-delay: calc(var(--i) * 45ms + 80ms); }
@keyframes rise { from { transform: translateY(8px); opacity: 0; } }

.rider { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.rider:last-child { border-bottom: 0; }
.rider img, .rider .ph { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; background: var(--ghost); box-shadow: 0 0 0 3px var(--lc); }
.rider .who { min-width: 0; display: grid; gap: 2px; }
.rider .nm { font-weight: 800; font-size: 16px; line-height: 1.2; }
.rider .rl { font-size: 13px; font-weight: 700; color: var(--muted); }
.rider .rl b { color: var(--lc); }
.rider .ttl { font-size: 14px; margin-top: 3px; }
.rider .sch { font-size: 13px; color: var(--muted); }
.li { justify-self: start; margin-top: 6px; display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; color: var(--ink); text-decoration: none; border: 2px solid var(--ink); border-radius: 4px; padding: 4px 9px 3px; transition: background-color .15s ease, color .15s ease; }
.li:hover { background: var(--ink); color: var(--bg); }
.li svg { width: 13px; height: 13px; fill: currentColor; }

.tables { padding-block: 30px 44px; border-top: 3px solid var(--ink); content-visibility: auto; contain-intrinsic-size: auto 1600px; }
.tables-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px; margin-bottom: 18px; }
.tables-head h2 { margin: 0; font-size: 24px; font-weight: 900; }
.search { width: min(360px, 100%); font: 400 15px var(--f-sign); color: var(--ink); background: var(--bg); border: 2px solid var(--ink); border-radius: 4px; padding: 9px 12px 7px; }
.search::placeholder { color: var(--muted); }
.grid { display: grid; gap: 28px 32px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); align-items: start; }
.tt-sign { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--lc); color: #fff; border-radius: 4px; font-weight: 800; font-size: 17px; }
.tt-sign .roundel { background: #fff; color: var(--lc); }
.tt-sign .n { margin-left: auto; font-family: var(--f-mono); font-size: 12px; opacity: .9; }
.stops { list-style: none; margin: 0; padding: 6px 0 0; }
.stop { position: relative; padding: 10px 0 4px 34px; }
.stop::before { content: ""; position: absolute; left: 10px; top: 0; bottom: 0; width: 6px; background: var(--lc); }
.stop:first-child::before { top: 18px; }
.stop:last-child::before { bottom: auto; height: 18px; }
.stop::after { content: ""; position: absolute; left: 4px; top: 10px; width: 18px; height: 18px; border-radius: 50%; background: var(--station); border: 3.5px solid var(--ink); }
.stop-name { background: none; border: 0; padding: 0; cursor: pointer; font-weight: 800; font-size: 15px; text-align: left; }
.stop-name:hover { text-decoration: underline; text-underline-offset: 3px; }
.stop .rider { padding: 10px 0; }
.empty { color: var(--muted); padding: 12px 0; }

@media (max-width: 760px) {
  .frame { height: 64svh; min-height: 380px; overflow-x: auto; overflow-y: hidden; overscroll-behavior-x: contain; margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); }
  .frame svg { width: auto; aspect-ratio: 1070 / 590; max-width: none; }
  .board { position: fixed; left: 0; right: 0; top: auto; bottom: 0; width: auto; max-height: 62svh; border-radius: 12px 12px 0 0; border-width: 2px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 20; animation-name: sheet-up; }
  @keyframes sheet-up { from { transform: translateY(40px); opacity: 0; } }
  .board header { padding-left: max(14px, env(safe-area-inset-left, 0px)); }
  .board ul { padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .line.sweep, #trains { display: none; }
}
</style>

  troy: { x: 852, y: 176, name: "Troy", dir: "n", ll: [42.73, -73.69] },
  hfd:  { x: 900, y: 192, name: "Hartford", dir: "e", ll: [41.76, -72.69] },
  bos:  { x: 918, y: 161, name: "Boston", dir: "e", ll: [42.36, -71.06] },
};

// Octilinear routes: station keys, plus [x, y] bends. A line may have several paths (branches).
const LINES = [
  { id: "Chairs", name: "Chairs Express", letter: "C", express: true, off: 0, stops: ["orl", "hfd"],
    paths: [["orl", [945, 359], [945, 237], "hfd"]] },
  { id: "Logistics", name: "Logistics Line", letter: "L", off: -3.2, stops: ["bay", "dfw", "atl", "chi", "bos"],
    paths: [["bay", [206, 439], "dfw", [681, 439], "atl", [715, 303], "chi", [718, 146], [903, 146], "bos"]] },
  { id: "Marketing", name: "Marketing Line", letter: "M", off: -3.2, stops: ["la", "atl", "dmv", "troy"],
    paths: [["la", [668, 358], "atl", [821, 299], "dmv", [776, 227], [776, 176], "troy"]] },
  { id: "Programming", name: "Programming Line", letter: "P", off: 3.2, stops: ["bay", "sd", "atl", "dmv", "phl"],
    paths: [["sd", "atl", [821, 299], "dmv", "phl"], ["bay", [172, 405], [210, 405]]] },
  { id: "SASEhack", name: "SASEhack Line", letter: "H", off: 0, stops: ["bay", "msp", "nyc", "bos"],
    paths: [["bay", [154, 161], "msp", [818, 161], "nyc", [875, 178], [892, 161], "bos"]] },
];
const LC = id => `var(--l-${id.toLowerCase()})`;
const lineOf = id => LINES.find(l => l.id === id);
const stopsOf = l => l.stops;
const NS = "http://www.w3.org/2000/svg";
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

const state = { line: null, station: null, q: "" };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

MEMBERS.forEach((m, i) => { m.i = i; m.hay = [m.name, m.role, m.committee, m.school, m.title, m.status, ST[m.metro].name].join(" ").toLowerCase(); });
const AT = {};
for (const m of MEMBERS) (AT[m.metro] ||= []).push(m);
const linesAt = k => LINES.filter(l => stopsOf(l).includes(k));
const matches = m => !state.q || state.q.split(/\s+/).every(t => m.hay.includes(t));
const radius = n => 6 + 3.4 * Math.sqrt(n);

const polyline = route => route.map(p => typeof p === "string" ? { x: ST[p].x, y: ST[p].y } : { x: p[0], y: p[1] });
function offset(pts, d) {
  if (!d) return pts;
  const nrm = (p, q) => { const L = Math.hypot(q.x - p.x, q.y - p.y); return { x: -(q.y - p.y) / L, y: (q.x - p.x) / L }; };
  return pts.map((p, i) => {
    const n1 = i > 0 ? nrm(pts[i - 1], p) : null, n2 = i < pts.length - 1 ? nrm(p, pts[i + 1]) : null;
    if (!n1 || !n2) { const n = n1 || n2; return { x: p.x + n.x * d, y: p.y + n.y * d }; }
    const k = d / (1 + n1.x * n2.x + n1.y * n2.y);
    return { x: p.x + (n1.x + n2.x) * k, y: p.y + (n1.y + n2.y) * k };
  });
}
function rounded(pts, r = 12) {
  const f = v => v.toFixed(1);
  let d = `M${f(pts[0].x)} ${f(pts[0].y)}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const p = pts[i], a = pts[i - 1], b = pts[i + 1];
    const la = Math.hypot(p.x - a.x, p.y - a.y), lb = Math.hypot(b.x - p.x, b.y - p.y);
    const ra = Math.min(r, la / 2), rb = Math.min(r, lb / 2);
    d += ` L${f(p.x + (a.x - p.x) * ra / la)} ${f(p.y + (a.y - p.y) * ra / la)} Q${f(p.x)} ${f(p.y)} ${f(p.x + (b.x - p.x) * rb / lb)} ${f(p.y + (b.y - p.y) * rb / lb)}`;
  }
  const z = pts[pts.length - 1];
  return d + ` L${f(z.x)} ${f(z.y)}`;
}
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

function drawMap() {
  const gL = $("lines"), gT = $("trains"), gS = $("stations"), gX = $("labels");
  LINES.forEach((l, i) => {
    const g = el("g", { "data-line": l.id }, gL);
    const tg = REDUCED ? null : el("g", { "data-line": l.id }, gT);
    l.paths.forEach((route, j) => {
      const d = rounded(offset(polyline(route), l.off));
      const base = el("path", { d, class: "line", stroke: LC(l.id), "stroke-width": l.express ? 6.5 : 5 }, g);
      if (l.express) el("path", { d, class: "line core" }, g);
      if (REDUCED) return;
      el("path", { d, class: "line sweep", pathLength: 1000, style: `--i:${i}` }, g);
      if (j > 0) return; // trains run on the trunk only
      const dur = base.getTotalLength() / (l.express ? 90 : 50);
      for (const [phase, kp] of [[0, "0;1"], [0.5, "1;0"]]) {
        const t = el("rect", { class: "train", x: -6, y: -3, width: 12, height: 6, rx: 3, stroke: LC(l.id) }, tg);
        el("animateMotion", { path: d, dur: `${dur.toFixed(1)}s`, begin: `${(1.8 + i * 0.18 - phase * dur).toFixed(2)}s`, repeatCount: "indefinite", rotate: "auto", keyPoints: kp, keyTimes: "0;1", calcMode: "linear" }, t);
      }
    });
  });

  const xs = Object.values(ST).map(s => s.x), x0 = Math.min(...xs), xw = Math.max(...xs) - x0;
  for (const k in ST) {
    const s = ST[k], n = (AT[k] || []).length, r = radius(n), ls = linesAt(k);
    const g = el("g", { class: "stn", "data-k": k, tabindex: 0, role: "button", "aria-pressed": "false", "aria-label": `${s.name}: ${n} ${n === 1 ? "teammate" : "teammates"}`, transform: `translate(${s.x} ${s.y})` }, gS);
    const p = el("g", { class: "pop", style: `--d:${Math.round(250 + (s.x - x0) / xw * 900)}` }, g);
    el("circle", { class: "halo", r: r + 4.5 }, p);
    el("circle", { class: "ring", r, stroke: ls.length > 1 ? "var(--ink)" : LC(ls[0].id) }, p);
    el("text", { class: "cnt", "font-size": (8 + r * 0.3).toFixed(1) }, p).textContent = n;

    // Label placement: compass direction from the station, multi-line labels stack away from it
    const lines = s.lbl || [s.name], gap = r + 6, lh = 14, extra = (lines.length - 1) * lh, d = gap * .72;
    const [dx, y0, anchor] = {
      e: [gap, s.y + 4.5 - extra / 2, "start"], w: [-gap, s.y + 4.5 - extra / 2, "end"],
      n: [0, s.y - gap - extra, "middle"], s: [0, s.y + gap + 10, "middle"],
      se: [d, s.y + d + 9, "start"], sw: [-d, s.y + d + 9, "end"],
      ne: [d, s.y - d - extra, "start"], nw: [-d, s.y - d - extra, "end"],
    }[s.dir];
    const t = el("text", { class: "lbl", "data-k": k, "text-anchor": anchor }, gX);
    lines.forEach((ln, i) => { el("tspan", { x: (s.x + dx).toFixed(1), y: (y0 + i * lh).toFixed(1) }, t).textContent = ln; });
  }
}

const LI = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/></svg>';
const rider = (m, i = 0) => `
  <li class="rider" data-i="${m.i}" style="--lc:${LC(m.committee)};--i:${i}">
    ${m.img ? `<img src="${m.img}" alt="" width="52" height="52" decoding="async">` : `<div class="ph"></div>`}
    <div class="who">
      <div class="nm">${esc(m.name)}</div>
      <div class="rl">${esc(m.role)} · <b>${esc(lineOf(m.committee).name)}</b></div>
      ${m.title ? `<div class="ttl">${esc(m.title)}</div><div class="sch">${esc(m.school)}</div>` : `<div class="sch">${m.status} · ${esc(m.school)}</div>`}
      <a class="li" href="https://www.linkedin.com/in/${encodeURIComponent(m.linkedin)}/" target="_blank" rel="noopener noreferrer">${LI}LinkedIn</a>
    </div>
  </li>`;
const roundel = l => `<span class="roundel${l.express ? " express" : ""}" style="--lc:${LC(l.id)}">${l.letter}</span>`;

function buildLegend() {
  $("legend").innerHTML = LINES.map(l => `<button class="lbtn" type="button" data-l="${l.id}" style="--lc:${LC(l.id)}" aria-pressed="false">${roundel(l)}${esc(l.name)}<span class="n">${MEMBERS.filter(m => m.committee === l.id).length}</span></button>`).join("");
}
function buildTables() {
  $("grid").innerHTML = LINES.map(l => {
    const stops = stopsOf(l).map(k => {
      const ppl = (AT[k] || []).filter(m => m.committee === l.id);
      return ppl.length ? `<li class="stop"><button class="stop-name" type="button" data-k="${k}">${esc(ST[k].name)}</button><ul class="stops">${ppl.map(m => rider(m)).join("")}</ul></li>` : "";
    }).join("");
    return `<article data-l="${l.id}" style="--lc:${LC(l.id)}"><div class="tt-sign">${roundel(l)}${esc(l.name)}<span class="n">${MEMBERS.filter(m => m.committee === l.id).length} · ${stopsOf(l).length} stops</span></div><ol class="stops">${stops}</ol></article>`;
  }).join("");
}

// Cached node lists so filtering only flips attributes
let NODES;
function cacheNodes() {
  NODES = {
    lines: [...document.querySelectorAll("#lines > g, #trains > g")],
    stations: [...document.querySelectorAll(".stn")],
    labels: [...document.querySelectorAll(".lbl")],
    legend: [...document.querySelectorAll(".lbtn")],
    articles: [...document.querySelectorAll("#grid > article")].map(a => ({
      a, l: a.dataset.l,
      stops: [...a.querySelectorAll(".stop")].map(s => ({ s, riders: [...s.querySelectorAll(".rider")].map(r => ({ r, m: MEMBERS[r.dataset.i] })) })),
    })),
  };
}

function update() {
  const hit = new Set(MEMBERS.filter(m => matches(m) && (!state.line || m.committee === state.line)).map(m => m.metro));
  for (const g of NODES.lines) g.classList.toggle("dim", !!state.line && g.dataset.line !== state.line);
  for (const g of NODES.stations) {
    const k = g.dataset.k;
    g.classList.toggle("dim", !hit.has(k));
    g.classList.toggle("on", state.station === k);
    g.setAttribute("aria-pressed", state.station === k);
  }
  for (const t of NODES.labels) t.classList.toggle("dim", !hit.has(t.dataset.k));
  for (const b of NODES.legend) b.setAttribute("aria-pressed", state.line === b.dataset.l);

  let shown = 0;
  for (const { a, l, stops } of NODES.articles) {
    let any = false;
    for (const { s, riders } of stops) {
      let vis = false;
      for (const { r, m } of riders) { const ok = matches(m); r.hidden = !ok; vis ||= ok; }
      s.hidden = !vis; any ||= vis;
    }
    a.hidden = !any || (!!state.line && l !== state.line);
    if (!a.hidden) shown++;
  }
  $("none").hidden = shown > 0;
  if (!shown) $("none").textContent = `No teammates match “${state.q}”.`;
}

function renderBoard() {
  const b = $("board"), k = state.station;
  if (!k) { b.hidden = true; return; }
  const s = ST[k], people = (AT[k] || []).filter(m => !state.line || m.committee === state.line);
  b.innerHTML = `
    <header>
      <h2>${esc(s.name)}</h2>
      <div class="coord">${Math.abs(s.ll[0]).toFixed(2)}°N ${Math.abs(s.ll[1]).toFixed(2)}°W</div>
      <div class="serves">${linesAt(k).map(roundel).join("")}</div>
      <button class="x" type="button" id="close" aria-label="Close">×</button>
    </header>
    <ul>${people.map(rider).join("") || `<li class="empty">No ${esc(state.line)} teammates here.</li>`}</ul>`;
  b.hidden = false;
  // Restart the entrance animation when switching stations
  b.style.animation = "none"; void b.offsetWidth; b.style.animation = "";
  b.scrollTop = 0;
  $("close").onclick = () => select(null);
}

function select(k) { state.station = k; update(); renderBoard(); }

$("stations").addEventListener("click", e => { const g = e.target.closest(".stn"); if (g) select(state.station === g.dataset.k ? null : g.dataset.k); });
$("stations").addEventListener("keydown", e => { const g = e.target.closest(".stn"); if (g && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); select(state.station === g.dataset.k ? null : g.dataset.k); } });
$("legend").addEventListener("click", e => {
  const b = e.target.closest(".lbtn"); if (!b) return;
  state.line = state.line === b.dataset.l ? null : b.dataset.l;
  update(); if (state.station) renderBoard();
});
$("grid").addEventListener("click", e => {
  const b = e.target.closest(".stop-name"); if (!b) return;
  select(b.dataset.k);
  $("frame").scrollIntoView({ behavior: REDUCED ? "auto" : "smooth", block: "start" });
  centerOn(b.dataset.k);
});
let qFrame = 0;
$("q").addEventListener("input", e => {
  cancelAnimationFrame(qFrame);
  const v = e.target.value.trim().toLowerCase();
  qFrame = requestAnimationFrame(() => { state.q = v; update(); });
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && state.station) select(null); });

function centerOn(k) {
  const f = $("frame"); if (f.scrollWidth <= f.clientWidth) return;
  const svg = $("map"), vb = svg.viewBox.baseVal, scale = svg.clientHeight / vb.height;
  f.scrollTo({ left: (ST[k].x - vb.x) * scale - f.clientWidth / 2, behavior: REDUCED ? "auto" : "smooth" });
}

// Pause the trains whenever the map is off screen
if (!REDUCED && "IntersectionObserver" in window) {
  const svg = $("map");
  new IntersectionObserver(([en]) => { en.isIntersecting ? svg.unpauseAnimations() : svg.pauseAnimations(); }).observe(svg);
}

drawMap();
buildLegend();
buildTables();
cacheNodes();
update();
requestAnimationFrame(() => { const f = $("frame"); if (f.scrollWidth > f.clientWidth) f.scrollLeft = f.scrollWidth - f.clientWidth; });
</script>

</body>
</html>
